<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Betterson — What you actually get as an Anderson student</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,600;0,700;1,700;1,800&family=Archivo+Black&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="index.html">Betterson</a>
    <div class="search">
      <input id="q" type="search" placeholder="Search benefits, places, providers…" aria-label="Search benefits">
      <button class="searchbtn" id="searchBtn" type="button" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
    </div>
    <nav class="topnav" aria-label="Main">
      <a href="index.html" aria-current="page">Browse</a>
      <a href="about.html">About</a>
      <a href="add.html">Add a benefit</a>
      <a href="partners.html">For businesses</a>
    </nav>
  </div>
</header>

<section class="catbar" aria-label="Categories">
  <div class="wrap">
    <nav class="tiles" id="tiles" aria-label="Filter by category"></nav>
  </div>
</section>

<div class="wrap">
  <h1 class="sr-only">Betterson — benefits you already have as an Anderson student</h1>

  <div class="layout">
    <aside class="sidebar" aria-label="Filters">
      <div class="sidebar-head">
        <h2>Filter</h2>
        <button class="reset" id="reset" type="button">Clear all</button>
      </div>
      <div class="fg">
        <h3>Who you are</h3>
        <div class="facets" id="f-elig"></div>
      </div>
      <div class="fg">
        <h3>How long it lasts</h3>
        <div class="facets" id="f-dur"></div>
      </div>
      <div class="fg">
        <h3>Where</h3>
        <div class="facets" id="f-loc"></div>
      </div>
    </aside>

    <main class="results">
      <div class="resultbar">
        <p class="count" id="count"></p>
        <button class="filterbtn" id="filterBtn" type="button" aria-haspopup="dialog">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
          Filters<span class="badge" id="filterCount" hidden></span>
        </button>
      </div>

      <div class="grid" id="grid"></div>
      <div class="notice" id="notice" hidden></div>
    </main>
  </div>

  <footer>
    <p>Every listing links to its source — worth a click before you count on it.</p>
  </footer>
</div>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<dialog id="filterSheet" aria-label="Filters">
  <div class="sheet filtersheet">
    <div class="sheet-head">
      <h2>Filters</h2>
      <button class="btn btn-primary" id="filterDone" type="button">Done</button>
    </div>
    <div class="fg">
      <h3>Who you are</h3>
      <div class="facets" id="m-elig"></div>
    </div>
    <div class="fg">
      <h3>How long it lasts</h3>
      <div class="facets" id="m-dur"></div>
    </div>
    <div class="fg">
      <h3>Where</h3>
      <div class="facets" id="m-loc"></div>
    </div>
    <p class="sheet-count" id="filterResult"></p>
    <button class="reset" id="filterReset" type="button">Clear all filters</button>
  </div>
</dialog>

<script src="js/app.js"></script>
</body>
</html>
